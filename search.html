<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Stories | ChillVibe</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header compact">
        <div class="container header-inner">
            <a href="index.html" class="logo font-serif text-accent">CHILLVIBE</a>
            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="search.html" class="active">Search</a>
            </nav>
        </div>
    </header>

    <main class="container mt-4 mb-5">
        <div class="search-container text-center">
            <h1 class="font-serif mb-2">Find a Story</h1>
            <input type="text" id="search-input" class="search-input" placeholder="Search by title, author, or keyword..." autocomplete="off">
        </div>

        <div id="search-results" class="story-grid mt-4">
            <!-- Results injected here -->
        </div>
        <div id="empty-state" class="hidden text-center mt-4 text-muted">
            <p>No stories found matching your criteria.</p>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="data/stories.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('search-input');
            const resultsContainer = document.getElementById('search-results');
            const emptyState = document.getElementById('empty-state');
            
            const renderResults = (query) => {
                resultsContainer.innerHTML = '';
                if (!query) {
                    emptyState.classList.add('hidden');
                    return;
                }

                const lowerQuery = query.toLowerCase();
                const filtered = chillVibeData.stories.filter(s => 
                    s.status === 'approved' && 
                    (s.title.toLowerCase().includes(lowerQuery) || 
                     s.author.toLowerCase().includes(lowerQuery) || 
                     s.category.toLowerCase().includes(lowerQuery))
                );

                if (filtered.length === 0) {
                    emptyState.classList.remove('hidden');
                } else {
                    emptyState.classList.add('hidden');
                    filtered.forEach(story => {
                        resultsContainer.appendChild(window.createStoryCard(story));
                    });
                }
            };

            searchInput.addEventListener('input', (e) => {
                renderResults(e.target.value);
            });
        });
    </script>
</body>
</html>
